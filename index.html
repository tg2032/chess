<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="ブラウザで遊べるチェス。スマホ・タブレットのタッチ操作（タップ／ドラッグ）に対応。">
<title>チェス</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>チェス</h1>
    <div class="topbar-right">
      <span class="status" id="status" role="status" aria-live="polite">白の番</span>
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="サウンドの切り替え">🔊</button>
    </div>
  </header>

  <main class="layout">

    <section class="board-frame">
      <div class="board" id="board" role="group" aria-label="チェスの盤面"></div>
    </section>

    <aside class="panel">

      <section class="players" aria-label="対局者">
        <div class="player" id="playerTop">
          <span class="side-badge" id="topBadge" aria-hidden="true">黒</span>
          <span class="player-name" id="topName">黒</span>
          <span class="captured" id="topCaptured" aria-hidden="true"></span>
          <b class="edge" id="topEdge"></b>
        </div>
        <div class="player" id="playerBottom">
          <span class="side-badge" id="bottomBadge" aria-hidden="true">白</span>
          <span class="player-name" id="bottomName">白</span>
          <span class="captured" id="bottomCaptured" aria-hidden="true"></span>
          <b class="edge" id="bottomEdge"></b>
        </div>
      </section>

      <section class="moves-wrap" aria-label="棋譜">
        <div class="moves-head">棋譜</div>
        <ol class="moves" id="moveList">
          <li class="empty">まだ一手も指されていません</li>
        </ol>
      </section>

      <section class="controls">
        <div class="segmented" role="group" aria-label="プレイモード">
          <button type="button" data-mode="pvp">2人対戦</button>
          <button type="button" data-mode="ai" class="selected">CPU戦</button>
        </div>

        <label class="select-wrap" id="levelWrap">
          <span class="sr-only">難易度</span>
          <select id="levelSelect" aria-label="難易度">
            <option value="easy">やさしい</option>
            <option value="normal" selected>ふつう</option>
            <option value="hard">むずかしい</option>
          </select>
        </label>

        <label class="select-wrap" id="sideWrap">
          <span class="sr-only">自分の色</span>
          <select id="sideSelect" aria-label="自分の色">
            <option value="0" selected>白で対局</option>
            <option value="1">黒で対局</option>
          </select>
        </label>

        <button type="button" class="btn" id="undoBtn" disabled>戻る</button>
        <button type="button" class="btn" id="hintBtn">ヒント</button>
        <button type="button" class="btn" id="resignBtn">投了</button>
        <button type="button" class="btn btn-primary" id="newBtn">新しいゲーム</button>
      </section>

      <p class="footnote" id="footnote"></p>

    </aside>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="promoOverlay" hidden>
  <div class="dialog promo-dialog" role="dialog" aria-modal="true" aria-labelledby="promoTitle">
    <h2 id="promoTitle">プロモートする駒を選ぶ</h2>
    <div class="promo-choices" id="promoChoices"></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">対局終了</h2>
    <p id="resultText"></p>
    <div class="result-line" id="resultLine"></div>
    <button type="button" class="btn btn-primary" id="againBtn">もう一度遊ぶ</button>
  </div>
</div>

<div class="drag-ghost" id="dragGhost" hidden></div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
